# Refresh the same-origin daily.json on gh-pages so GitHub Pages can show
# today's verse without a browser fetch of discoverybiblestudy.org (no CORS/CORP).
name: Daily verse

on:
  schedule:
    - cron: '20 0 * * *'
    - cron: '10 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Fetch verse of the day
        run: |
          curl -fsSL "https://discoverybiblestudy.org/daily/api/" -o daily.json
          python -c "import json; data=json.load(open('daily.json', encoding='utf-8')); assert isinstance(data.get('text'), str) and isinstance(data.get('ref'), str)"
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily.json
          git diff --cached --quiet && echo "Verse unchanged" && exit 0
          git commit -m "Refresh daily verse"
          git push
